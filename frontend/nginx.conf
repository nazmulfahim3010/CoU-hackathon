server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Recordings are uploaded through /api; allow up to the backend limit.
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;   # live speech/LLM calls can take a while
    }

    # Single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri /index.html;
    }
}
