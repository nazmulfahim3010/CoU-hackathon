# Kotha: backend (FastAPI + ffmpeg) and frontend (nginx).
#
#   docker compose up --build            -> app on http://localhost:8080 (API docs: http://localhost:8000/docs)
#   docker compose run --rm backend-test -> full backend test suite inside the image (ffmpeg included)
#
# Live mode needs keys: copy backend/.env.example to backend/.env and fill it in. Without it the app
# runs in demo mode. Keys stay on the backend and are never sent to the browser.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: backend/.env
        required: false
    environment:
      CORS_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173"
      # Set to your computer's Wi-Fi address (e.g. http://192.168.1.20:8080) so share links/QR work from a phone
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

  backend-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider", "--basetemp=/tmp/pytest"]
    environment:
      # Tests must never depend on real keys or hit real providers.
      SPEECH_PROVIDER: "none"
      LLM_PROVIDER: "none"
